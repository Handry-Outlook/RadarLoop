<!doctype html>
<html lang="en-GB" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RadarLoop</title>
  <meta name="description" content="Multi-source weather radar, satellite and lightning viewer.">
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/Handry-Outlook/Convective-Outlook/main/Handry_outlook_icon_pride_small.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Mapping libraries -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css">
  <link rel="stylesheet" href="https://cdn.aerisapi.com/sdk/js/mapsgl/latest/aerisweather.mapsgl.css">

  <!-- Application styles -->
  <style>
/**
 * Design tokens.
 *
 * Every colour, space, radius and shadow in the application resolves to one of
 * these. The legacy stylesheet hard-coded values inline in ~3,200 lines with the
 * same greys spelled six different ways, which is why the panel drifted visually
 * from section to section.
 *
 * Dark is the primary theme (this is an operational display, usually run for long
 * periods). Light is a real variant, not an afterthought.
 */

:root {
  color-scheme: dark;

  /* ---- Surfaces: raised in steps, never arbitrary ---- */
  --surface-0: #070a10;   /* app background, behind the map */
  --surface-1: #0d1219;   /* panels, top bar */
  --surface-2: #141b25;   /* cards inside panels */
  --surface-3: #1c2532;   /* inputs, hover states */
  --surface-4: #26313f;   /* pressed / active */

  --border-subtle: #1e2937;
  --border-strong: #2c3a4d;
  --border-focus: #38bdf8;

  /* ---- Text ---- */
  --text-primary: #e8edf5;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;
  --text-inverse: #0b0f17;

  /* ---- Brand & accents ---- */
  --accent: #38bdf8;
  --accent-strong: #0ea5e9;
  --accent-soft: rgba(56, 189, 248, 0.14);
  --accent-text: #7dd3fc;

  /* ---- Semantic ---- */
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --danger-strong: #ef4444;
  --info: #818cf8;

  /* Weather-domain accents, used by layer groups and the legend */
  --wx-radar: #38bdf8;
  --wx-satellite: #a78bfa;
  --wx-lightning: #fbbf24;
  --wx-severe: #f43f5e;
  --wx-outlook: #34d399;
  --wx-pressure: #94a3b8;

  /* ---- Typography ---- */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 20px;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ---- Space: a 4px scale ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ---- Radii ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 14px;
  --radius-pill: 999px;

  /* ---- Elevation ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);

  /* ---- Layout ---- */
  --rail-width: 56px;
  --panel-width: 336px;
  --topbar-height: 48px;
  --timeline-height: 88px;

  /* ---- Motion ---- */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;

  /* ---- Stacking (above Leaflet's own panes) ---- */
  --z-map: 1;
  --z-floating: 600;
  --z-rail: 700;
  --z-panel: 690;
  --z-topbar: 720;
  --z-timeline: 710;
  --z-modal: 900;
  --z-toast: 950;
}

:root[data-theme='light'] {
  color-scheme: light;

  --surface-0: #eef1f6;
  --surface-1: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #eaeef4;
  --surface-4: #dde3ec;

  --border-subtle: #dde3ec;
  --border-strong: #c3ccda;

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #7c8798;
  --text-inverse: #ffffff;

  --accent: #0284c7;
  --accent-strong: #0369a1;
  --accent-soft: rgba(2, 132, 199, 0.12);
  --accent-text: #0369a1;

  --ok: #059669;
  --warn: #b45309;
  --danger: #dc2626;
  --info: #4f46e5;

  --wx-radar: #0284c7;
  --wx-satellite: #7c3aed;
  --wx-lightning: #b45309;
  --wx-severe: #e11d48;
  --wx-outlook: #059669;
  --wx-pressure: #475569;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
  }
}


/** Reset, primitives and shared form controls. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--surface-0);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/**
 * The `hidden` attribute must beat component display rules.
 *
 * The UA stylesheet sets `[hidden] { display: none }`, but any author rule such
 * as `.chip { display: inline-flex }` outranks it — so `element.hidden = true`
 * silently did nothing for several components (the timeline focus chip showed
 * as an empty pill at all times). Everything that toggles visibility through
 * `.hidden` depends on this.
 */
[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

::selection {
  background: var(--accent-soft);
}

h1, h2, h3, h4, h5 {
  margin: 0;
  font-weight: var(--weight-semibold);
  letter-spacing: -0.01em;
}

p { margin: 0; }

/* ---------------- Scrollbars ---------------- */

.scroll-thin {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
.scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-thin::-webkit-scrollbar-track { background: transparent; }
.scroll-thin::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  background-clip: content-box;
}
.scroll-thin::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); background-clip: content-box; }

/* ---------------- Buttons ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-3);
  color: var(--text-primary);
  font: inherit;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease);
}
.btn:hover { background: var(--surface-4); border-color: var(--text-tertiary); }
.btn:active { transform: translateY(0.5px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-inverse);
  font-weight: var(--weight-semibold);
}
.btn--primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

.btn--ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--surface-3); color: var(--text-primary); }

.btn--danger { color: var(--danger); border-color: transparent; background: transparent; }
.btn--danger:hover { background: rgba(248, 113, 113, 0.12); }

.btn--icon {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: var(--text-md);
}

.btn--block { width: 100%; }

/* ---------------- Inputs ---------------- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field__label {
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.input,
.select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-3);
  color: var(--text-primary);
  font: inherit;
  font-size: var(--text-sm);
}
.input:hover,
.select:hover { border-color: var(--text-tertiary); }

.select {
  appearance: none;
  padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 12px top 15px, right 7px top 15px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.select optgroup { background: var(--surface-2); color: var(--text-tertiary); font-style: normal; }
.select option { background: var(--surface-2); color: var(--text-primary); }

input[type='datetime-local'],
input[type='number'] { color-scheme: inherit; }

/* ---------------- Toggle switch ---------------- */

.switch {
  position: relative;
  display: inline-flex;
  flex: none;
  width: 34px;
  height: 19px;
  cursor: pointer;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.switch__track {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-pill);
  background: var(--surface-4);
  border: 1px solid var(--border-strong);
  transition: background var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease);
  pointer-events: none;
}
.switch__track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--text-secondary);
  transition: transform var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease);
}
.switch input:checked + .switch__track {
  background: var(--accent);
  border-color: var(--accent);
}
.switch input:checked + .switch__track::after {
  transform: translateX(15px);
  background: var(--text-inverse);
}
.switch input:focus-visible + .switch__track {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

/* ---------------- Range slider ---------------- */

.range {
  --range-fill: var(--accent);
  width: 100%;
  height: 18px;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
.range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--surface-4);
}
.range::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--surface-4);
}
.range::-webkit-slider-thumb {
  appearance: none;
  width: 13px;
  height: 13px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--range-fill);
  border: 2px solid var(--surface-1);
  box-shadow: var(--shadow-sm);
}
.range::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--range-fill);
  border: 2px solid var(--surface-1);
}
.range:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------------- Utility ---------------- */

.row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.row--between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: var(--space-3); }
.muted { color: var(--text-secondary); }
.dim { color: var(--text-tertiary); }
.tiny { font-size: var(--text-xs); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  color: var(--text-secondary);
}
.chip__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
}
.chip--live .chip__dot { background: var(--ok); animation: pulse 2s var(--ease) infinite; }
.chip--stale .chip__dot { background: var(--warn); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.spinner {
  width: 13px;
  height: 13px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex: none;
}


/** Application shell: top bar, icon rail, slide-over panel, timeline, overlays. */

/* ================================================================== *
 * Shell
 * ================================================================== */

.app {
  display: grid;
  grid-template-rows: var(--topbar-height) 1fr;
  height: 100vh;
  height: 100dvh;
}

.map-area {
  position: relative;
  overflow: hidden;
}

#map,
#map-3d {
  position: absolute;
  inset: 0;
}
#map-3d { display: none; }
.app[data-mode='3d'] #map-3d { display: block; }

/**
 * In 3D the Leaflet map is hidden but deliberately *not* `display: none`.
 *
 * Two products — the recoloured Global High Resolution composite and OPERA — are
 * mirrored into 3D by capturing the canvases Leaflet has already painted. Taking
 * the map out of layout collapses its size and its tiles' box metrics, so those
 * captures come back empty or stale and the 3D radar stops following the
 * scrubber. Keeping it laid out but invisible costs a little compositing and
 * makes the capture deterministic.
 */
.app[data-mode='3d'] #map {
  visibility: hidden;
  pointer-events: none;
}

/* ================================================================== *
 * Top bar
 * ================================================================== */

.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-3);
  background: var(--surface-1);
  border-bottom: 1px solid var(--border-subtle);
  z-index: var(--z-topbar);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: var(--weight-bold);
  font-size: var(--text-md);
  letter-spacing: -0.02em;
  flex: none;
}
.brand__logo {
  height: 26px;
  width: auto;
  display: block;
}
/* The wordmark is light-on-dark artwork; on a light ground it needs a nudge. */
:root[data-theme='light'] .brand__logo {
  filter: brightness(0.15) saturate(0);
}
.brand__fallback { font-size: var(--text-md); }

/* Shown only on narrow screens, where the rail collapses into this button. */
.panel-toggle { display: none; }

.topbar__status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  overflow: hidden;
}

.topbar__spacer { flex: 1; }

.topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  flex: none;
}

/* Layer search */
.search {
  position: relative;
  width: 210px;
  flex: none;
}
.search__input { padding-left: 28px; }
.search__icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
  font-size: var(--text-sm);
}
.search__results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 380px;
  max-height: 420px;
  overflow-y: auto;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: var(--space-1);
  z-index: var(--z-modal);
}
.search__results[hidden] { display: none; }
.search__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  padding: 7px 9px;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  font-size: var(--text-sm);
  text-align: left;
  cursor: pointer;
}
.search__item:hover,
.search__item[aria-selected='true'] { background: var(--surface-3); }
.search__item-group {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  flex: none;
}
.search__empty { padding: var(--space-3); color: var(--text-tertiary); font-size: var(--text-sm); }

/* ================================================================== *
 * Icon rail
 * ================================================================== */

.rail {
  position: absolute;
  top: var(--space-3);
  left: var(--space-3);
  bottom: calc(var(--timeline-height) + var(--space-3));
  width: var(--rail-width);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-2) 0;
  background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  z-index: var(--z-rail);
  overflow-y: auto;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }

.rail__btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin: 0 auto;
  border: 0;
  border-radius: var(--radius-lg);
  background: transparent;
  color: var(--text-secondary);
  font-size: 17px;
  cursor: pointer;
  flex: none;
  transition: background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
}
/* Belt and braces with the U+FE0E in the icon itself: keep rail glyphs
   monochrome even where a browser would prefer a colour emoji font. */
.rail__btn { font-variant-emoji: text; }
.rail__btn:hover { background: var(--surface-3); color: var(--text-primary); }
.rail__btn[aria-selected='true'] {
  background: var(--accent-soft);
  color: var(--accent-text);
}
/* Active-group marker on the rail edge */
.rail__btn[aria-selected='true']::before {
  content: '';
  position: absolute;
  left: -8px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: var(--accent);
}
/* Dot showing the group has an active layer */
.rail__btn[data-active='true']::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 2px var(--surface-1);
}

.rail__divider {
  height: 1px;
  margin: var(--space-1) var(--space-3);
  background: var(--border-subtle);
  flex: none;
}

/* Tooltip */
.rail__btn[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  padding: 5px 9px;
  border-radius: var(--radius-md);
  background: var(--surface-4);
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  white-space: nowrap;
  box-shadow: var(--shadow-md);
  pointer-events: none;
  z-index: 1;
}

/* ================================================================== *
 * Slide-over panel
 * ================================================================== */

.panel {
  position: absolute;
  top: var(--space-3);
  left: calc(var(--rail-width) + var(--space-3) * 2);
  bottom: calc(var(--timeline-height) + var(--space-3));
  width: var(--panel-width);
  display: flex;
  flex-direction: column;
  background: color-mix(in srgb, var(--surface-1) 96%, transparent);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  z-index: var(--z-panel);
  transition: opacity var(--duration-base) var(--ease), transform var(--duration-base) var(--ease);
}
/* The panel animates out rather than disappearing, so it opts out of the
   global `[hidden] { display: none !important }` rule in base.css. */
.panel[hidden] {
  display: flex !important;
  opacity: 0;
  transform: translateX(-12px);
  pointer-events: none;
}

.panel__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  flex: none;
}
.panel__title {
  font-size: var(--text-md);
  font-weight: var(--weight-semibold);
}
.panel__subtitle {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
}

.panel__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* ================================================================== *
 * Layer cards
 * ================================================================== */

.card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  overflow: hidden;
  transition: border-color var(--duration-fast) var(--ease);
}
.card[data-active='true'] { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-subtle)); }

.card__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
}
.card__accent {
  width: 3px;
  height: 22px;
  border-radius: var(--radius-pill);
  background: var(--card-accent, var(--accent));
  flex: none;
}
.card__title {
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  flex: 1;
  min-width: 0;
}
.card__meta {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  font-weight: var(--weight-regular);
}

.card__body {
  padding: 0 var(--space-3) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.card__body[hidden] { display: none; }

.opacity-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}
.opacity-row output {
  min-width: 34px;
  text-align: right;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
}

/* Collapsible advanced block */
.disclosure {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-2);
}
.disclosure > summary {
  cursor: pointer;
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  color: var(--text-secondary);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary::before {
  content: '▸';
  font-size: 9px;
  transition: transform var(--duration-fast) var(--ease);
}
.disclosure[open] > summary::before { transform: rotate(90deg); }
.disclosure > summary:hover { color: var(--text-primary); }
.disclosure__body { padding-top: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); }

/* ================================================================== *
 * Layer manager
 * ================================================================== */

.layer-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  position: relative;
}

.layer-row {
  display: flex;
  align-items: stretch;
  gap: var(--space-2);
  padding: var(--space-2);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--row-accent, var(--accent));
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  touch-action: none; /* pointer dragging owns the gesture */
}

/* The row being dragged is lifted out of flow and follows the pointer. */
.layer-row--dragging {
  position: fixed;
  z-index: var(--z-modal);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
  opacity: 0.96;
  pointer-events: none;
}

/* The gap the dragged row will drop into. */
.layer-row--placeholder {
  background: var(--accent-soft);
  border-style: dashed;
  border-color: var(--accent);
}
.layer-row--placeholder > * { display: none; }

.layer-row__handle {
  display: grid;
  place-items: center;
  width: 26px;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-tertiary);
  font-size: 15px;
  cursor: grab;
  flex: none;
  letter-spacing: -2px;
}
.layer-row__handle:hover { background: var(--surface-3); color: var(--text-primary); }
.layer-row__handle:active { cursor: grabbing; }

.layer-row__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.layer-row__title {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
}
.layer-row__meta {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
}
.layer-row__body .opacity-row { margin-top: 2px; }
.layer-row__body .opacity-row > span:first-child { display: none; }

.layer-row__actions {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: none;
}
.layer-row__actions .btn--icon { width: 26px; height: 22px; font-size: 11px; }

/* Branded panel header (Handry Outlook) */
.panel-brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
}
.panel-brand__icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  flex: none;
}
.panel-brand__title {
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
}

/* Pressed state for toggle buttons in the top bar (3D). */
.btn--active {
  background: var(--accent-soft);
  color: var(--accent-text);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  font-weight: var(--weight-bold);
}

/* Section heading inside the panel */
.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}

/* Switch row */
.switch-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  justify-content: space-between;
}
.switch-row__label { font-size: var(--text-sm); }
.switch-row__hint { font-size: var(--text-xs); color: var(--text-tertiary); }

/* ================================================================== *
 * Timeline
 * ================================================================== */

.timeline {
  position: absolute;
  left: var(--space-3);
  right: var(--space-3);
  bottom: var(--space-3);
  height: var(--timeline-height);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  z-index: var(--z-timeline);
}

.timeline__top {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.timeline__readout {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  min-width: 190px;
}
.timeline__clock {
  font-family: var(--font-mono);
  font-size: var(--text-xl);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.timeline__date { font-size: var(--text-xs); color: var(--text-tertiary); }

/* Shown when the timeline is pinned to a filter or outlook window. */
.chip--focus {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border-subtle));
  background: var(--accent-soft);
  color: var(--accent-text);
  cursor: pointer;
  font: inherit;
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  max-width: 230px;
}
.chip--focus:hover { background: color-mix(in srgb, var(--accent) 24%, transparent); }
.chip--focus .chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip__close { opacity: 0.6; font-size: 9px; }
.chip--focus:hover .chip__close { opacity: 1; }

.timeline__transport {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.timeline__scrub {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Tick marks under the scrubber */
.timeline__ticks {
  position: relative;
  height: 10px;
  pointer-events: none;
}
.timeline__tick {
  position: absolute;
  top: 0;
  width: 1px;
  height: 4px;
  background: var(--border-strong);
  transform: translateX(-0.5px);
}
.timeline__tick--major { height: 7px; background: var(--text-tertiary); }
.timeline__tick-label {
  position: absolute;
  top: 6px;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  white-space: nowrap;
}

.timeline__meta {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  flex-wrap: wrap;
}

/* ================================================================== *
 * Floating cards (legend, outlook)
 * ================================================================== */

.floating {
  position: absolute;
  right: var(--space-3);
  width: 250px;
  max-height: calc(100% - var(--timeline-height) - var(--space-6));
  display: flex;
  flex-direction: column;
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  z-index: var(--z-floating);
  overflow: hidden;
}
.floating--legend { top: var(--space-3); }

.floating__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  flex: none;
}
.floating__body {
  padding: var(--space-3);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  font-size: var(--text-xs);
}
.floating[data-collapsed='true'] .floating__body { display: none; }

/* Legend entries */
.legend-group { display: flex; flex-direction: column; gap: 6px; }
.legend-group__title {
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  font-size: var(--text-xs);
}
.legend-scale {
  display: flex;
  height: 10px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}
.legend-scale__step { flex: 1; }
.legend-scale__labels {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.legend-item { display: flex; align-items: center; gap: var(--space-2); }
.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  border: 1px solid rgba(0, 0, 0, 0.25);
}

/* ================================================================== *
 * Calendar (outlooks)
 * ================================================================== */

.calendar { display: flex; flex-direction: column; gap: var(--space-2); }
.calendar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
}
.calendar__grid,
.calendar__weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.calendar__weekdays {
  font-size: 9px;
  color: var(--text-tertiary);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.calendar__day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  color: var(--text-secondary);
  font-size: var(--text-xs);
  cursor: pointer;
  position: relative;
}
.calendar__day:hover { border-color: var(--border-strong); color: var(--text-primary); }
.calendar__day[data-empty='true'] { background: transparent; cursor: default; color: var(--text-tertiary); opacity: 0.35; }
.calendar__day[aria-selected='true'] { border-color: var(--accent); color: var(--text-primary); }
.calendar__day[data-risk]::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 60%;
  height: 2px;
  border-radius: var(--radius-pill);
  background: var(--day-risk, var(--accent));
}
.calendar__day[data-today='true'] { font-weight: var(--weight-bold); color: var(--text-primary); }

/* ================================================================== *
 * Progress
 * ================================================================== */

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius-lg);
  background: var(--surface-3);
}
.progress[hidden] { display: none; }
.progress__dial {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--accent) var(--pct, 0%), var(--surface-4) 0);
  flex: none;
}
.progress__dial::after {
  content: attr(data-pct);
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: var(--surface-2);
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
}
.progress__text { font-size: var(--text-xs); color: var(--text-secondary); }

/* ================================================================== *
 * Modal
 * ================================================================== */

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(3, 6, 12, 0.65);
  backdrop-filter: blur(3px);
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: var(--space-4);
}
.scrim[hidden] { display: none; }

.modal {
  width: min(620px, 100%);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.modal__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  flex: none;
}
.modal__title { font-size: var(--text-lg); flex: 1; }
.modal__body {
  padding: var(--space-4);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  font-size: var(--text-sm);
  line-height: 1.6;
  color: var(--text-secondary);
}
.modal__body h4 { color: var(--text-primary); font-size: var(--text-sm); margin-bottom: var(--space-1); }
.modal__body ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); }
.modal__body li { margin-bottom: 3px; }
.modal__body kbd {
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-primary);
}
.modal__foot {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  flex: none;
}

/* ================================================================== *
 * Toasts
 * ================================================================== */

.toasts {
  position: fixed;
  bottom: calc(var(--timeline-height) + var(--space-6));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: var(--z-toast);
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 9px 14px;
  border-radius: var(--radius-pill);
  background: var(--surface-4);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg);
  font-size: var(--text-sm);
  animation: toast-in var(--duration-base) var(--ease);
  pointer-events: auto;
}
.toast[data-tone='error'] { border-color: var(--danger); color: var(--danger); }
.toast[data-tone='success'] { border-color: var(--ok); }

.toast__action {
  margin-left: var(--space-1);
  padding: 4px 10px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  color: var(--accent-text);
  font: inherit;
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  cursor: pointer;
  white-space: nowrap;
}
.toast__action:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ================================================================== *
 * Palette editor
 * ================================================================== */

.palette-preview {
  display: flex;
  height: 14px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}
.palette-preview__step { flex: 1; }

.palette-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
  gap: 5px;
}
.palette-swatch {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 9px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.palette-swatch input[type='color'] {
  width: 100%;
  height: 20px;
  padding: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
}

/* ================================================================== *
 * Leaflet overrides
 * ================================================================== */

.leaflet-container {
  background: var(--surface-0);
  font-family: var(--font-sans);
}
/* Provider credits are not shown anywhere in the interface. The map libraries
   and their plugins each add their own — Leaflet's attribution control, the
   Mapbox GL logo and attribution, MapTiler's logo, and whatever MapsGL injects —
   and several of them re-add it after a restyle or a layer change, so they are
   suppressed here as well as being switched off at construction. */
.leaflet-control-attribution,
.mapboxgl-ctrl-attrib,
.mapboxgl-ctrl-logo,
.mapboxgl-ctrl-attrib-button,
.maplibregl-ctrl-attrib,
.maplibregl-ctrl-logo,
.maptiler-logo,
.mapsgl-attribution,
[class*='-ctrl-attrib'],
[class*='-ctrl-logo'] {
  display: none !important;
}

/* Weather tiles: seams between adjacent tiles are very visible on
   semi-transparent overlays, so nudge them to overlap by a hair. */
.wx-tile {
  image-rendering: -webkit-optimize-contrast;
  will-change: opacity;
}
.windy-radar-tile { image-rendering: pixelated; }
.opera-radar-canvas,
.strike-canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

.strike-count {
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: var(--weight-bold);
  color: #fff;
  text-shadow: 0 0 3px #000, 0 0 6px #000;
  pointer-events: none;
}

/* Popups */
.wx-popup-shell .leaflet-popup-content-wrapper {
  padding: 0;
  border-radius: var(--radius-lg);
  background: var(--surface-1);
  color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-strong);
  overflow: hidden;
}
.wx-popup-shell .leaflet-popup-content { margin: 0; width: auto !important; }
.wx-popup-shell .leaflet-popup-tip { background: var(--surface-1); border: 1px solid var(--border-strong); }
.wx-popup-shell .leaflet-popup-close-button { color: var(--text-tertiary); }

.wx-popup { min-width: 210px; font-size: var(--text-sm); }
.wx-popup__head {
  padding: var(--space-3);
  border-top: 3px solid var(--accent, #38bdf8);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--surface-2);
}
.wx-popup__eyebrow {
  display: block;
  font-size: 9px;
  font-weight: var(--weight-bold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent, #38bdf8);
}
.wx-popup__impact {
  padding: var(--space-2) var(--space-3);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  border-bottom: 1px solid var(--border-subtle);
}
.wx-popup__rows {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px var(--space-3);
  margin: 0;
  padding: var(--space-3);
  font-size: var(--text-xs);
}
.wx-popup__rows--grid { grid-template-columns: 1fr 1fr; }
.wx-popup__rows--grid > div { display: flex; flex-direction: column; }
.wx-popup__rows dt { color: var(--text-tertiary); text-transform: capitalize; }
.wx-popup__rows dd { margin: 0; color: var(--text-primary); }
.wx-popup__body {
  padding: 0 var(--space-3) var(--space-3);
  max-height: 220px;
  overflow-y: auto;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: pre-wrap;
}

/* ================================================================== *
 * Responsive
 * ================================================================== */

/* ================================================================== *
 * Responsive
 *
 * Two breakpoints. At tablet width the panel narrows and the legend goes.
 * Below 720px the layout changes shape rather than just shrinking: the icon
 * rail becomes a horizontal scroller docked above the timeline (thumb-reachable
 * rather than stretched down the far edge), and the panel becomes a bottom
 * sheet, which is where a one-handed grip expects controls to be.
 * ================================================================== */

@media (max-width: 1100px) {
  :root { --panel-width: 300px; }
  .search { width: 150px; }
  .floating--legend { width: 210px; }
}

@media (max-width: 900px) {
  :root { --timeline-height: 96px; }
  .search { display: none; }
  .floating--legend { display: none; }
  .timeline__readout { min-width: 0; }
  .timeline__clock { font-size: var(--text-lg); }
  .panel { width: calc(100vw - var(--rail-width) - var(--space-3) * 3); }
}

  ['#rail', '--rail-dock'],

    .map(([selector, name]) => [document.querySelector(selector), name])

      // zero while the element is hidden, which is exactly what we want the
      // stylesheet to see.

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

function restoreSession() {
  const saved = loadSetting('layers', null);
  if (saved) {
    restoreSelection(saved);
  } else {
    // First run: a sensible default view rather than a blank map.
    const radar = slots.get('radar');
    radar.enabled = true;
    radar.type = 'windy-radar';
    radar.opacity = 0.9;

    const satellite = slots.get('satellite');
    satellite.enabled = true;
    satellite.type = 'eumetsat-geocolor';
    satellite.opacity = 1;
  }
}

const persistSession = debounce(() => saveSetting('layers', serialiseSelection()), 600);

function bindTopbar() {

  byId('btn-help')?.addEventListener('click', showHelp);

  // On narrow screens the rail collapses; this reopens the last panel group.
  byId('btn-panel')?.addEventListener('click', () => {

    else openGroup(lastOpenedGroup());

      return;

    btn3d.classList.toggle('btn--active', on);

    setTimeout(() => {
      if (!runtime.is3D) return;

      const missing = [];
      for (const [group, slot] of slots) {

        if (mirrored.has(group)) continue;
        missing.push(getLayerDef(group, slot.type)?.label || slot.type);
      }
      if (!missing.length) return;
      console.info(`[3d] not mirrored: ${missing.join(', ')}`);

/* ------------------------------------------------------------------ *
 * Cross-cutting wiring

function bindEvents() {
  // The single place a time change turns into a weather re-render.
  on(EVENTS.TIME_COMMITTED, (timestamp) => renderAll(timestamp));

  // Resume any render that was deferred while the map was being manipulated.
  on(EVENTS.MAP_INTERACTION, ({ interacting }) => {
    if (!interacting) flushPending();
  });

  on(EVENTS.LAYER_TOGGLED, persistSession);
  on(EVENTS.LAYER_SELECTED, persistSession);

  // A dark base map wants the dark UI theme; keep them in step unless the user
  // has explicitly chosen otherwise.
  on(EVENTS.BASEMAP_CHANGED, ({ id }) => saveSetting('basemap', id));

  on(EVENTS.THEME_CHANGED, () => {
    // Leaflet caches container colours in a few places; a resize settles them.
    requestAnimationFrame(invalidateSizeIfChanged);
    refresh3DTheme();
  });

  // The GL style follows the base map choice, so changing it in 3D restyles.
  on(EVENTS.BASEMAP_CHANGED, () => refresh3DTheme());

  // A restyle drops every layer the GL map held, so re-feed it. The renderer
  // skips slots whose frame is already drawn, so the mirror is fed from the
  // layers the 2D map already holds rather than through a re-render.
  on(EVENTS.MAP3D_READY, () => {
    const failed = remirrorAll();
    refreshLightning({ force: true });
    if (failed.length) console.info('[3d] could not mirror:', failed.join(', '));
  });

  // Leaving 3D by any route must reset the toggle's pressed state.
  on(EVENTS.MODE_CHANGED, ({ mode }) => {
    const btn = byId('btn-3d');
    if (!btn) return;
    btn.setAttribute('aria-pressed', String(mode === '3d'));
    btn.classList.toggle('btn--active', mode === '3d');
  });

  window.addEventListener('resize', debounce(invalidateSizeIfChanged, 150));

  // Re-render on view change so viewport-dependent products (OPERA, accumulation)
  // stay correct, but only once the map has settled.
  map.on('moveend zoomend', debounce(() => {
    if (!runtime.interacting) renderAll(time.current);
  }, 220));
}
