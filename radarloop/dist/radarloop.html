 * times per frame is most of a second; done once when the strike arrives, a
 * frame costs one multiply and one subtract per strike. The provider's own
 * client stores its strikes the same way, which is a good sign it is the right
 * shape rather than a clever idea.
 *
 * A buffer is `{ mx, my, t, base, count }`: normalised Mercator x and y in
 * `[0, 1]` as Float32, milliseconds after `base` as Uint32, which covers 49
 * days per buffer.
 */

/** Normalised Mercator x for a longitude, in [0, 1]. */
const mercatorX = (lon) => (lon + 180) / 360;

/** Normalised Mercator y for a latitude, in [0, 1], clamped at the poles. */
function mercatorY(lat) {
  const clamped = Math.max(-85.05112878, Math.min(85.05112878, lat));
  const s = Math.sin((clamped * Math.PI) / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}

/** Inverse of `mercatorY`, for turning a hit test back into a position. */
function latFromMercatorY(y) {
  return (2 * Math.atan(Math.exp((0.5 - y) * 2 * Math.PI)) - Math.PI / 2) * (180 / Math.PI);
}

/**
 * Above this many strikes in view, each is drawn as a point rather than a cross.
 *
 * Not a cap: every strike in view is still drawn either way. At this density the
 * crosses overlap into solid colour, so the arms cost four path operations each
 * to draw something indistinguishable from a dot — and the dot path writes
 * pixels straight into an image buffer, which is roughly a hundred times faster
 * than asking the canvas to stroke two million line segments.
 */
const DENSE_THRESHOLD = 24000;

/**
 * Above this many held strikes, the visible count is taken from the last frame
 * rather than recounted. A quarter of a million is a couple of milliseconds to
 * count and far more than any view that could still be drawing shapes.
 */
const COUNT_EXACTLY_BELOW = 250000;

/** Age ramp as packed pixels, for the dense path. */
const AGE_PIXELS = AGE_STOPS.map(([, colour]) => packColour(colour));
const STATIC_PIXEL = packColour(STATIC_COLOUR);
const FRESH_PIXEL = packColour(FRESH_COLOUR);

/** `#rrggbb` to the little-endian ABGR word an ImageData buffer wants. */
function packColour(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

/** First index in a buffer whose strike is at or after a moment. */
function firstAtOrAfter(buffer, ms) {
  const target = ms - buffer.base;
  const { t, count } = buffer;
  let lo = 0;
  let hi = count;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (t[mid] < target) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

/* ------------------------------------------------------------------ *
 * The layer
 * ------------------------------------------------------------------ */

const StrikeCanvasLayer = L.Layer.extend({
  initialize(options = {}) {
    L.setOptions(this, options);
    this._strikes = [];
    this._buffers = [];
    this._freshSince = 0;
    this._image = null;
    this._pixels = null;
    this._windowEnd = Date.now();
    this._lifespanMs = 3 * 3600 * 1000;
    this._flashes = [];
    this._frame = null;
    this._onViewChange = () => this._schedule();
  },

  onAdd(leafletMap) {
    this._map = leafletMap;
    this._canvas = L.DomUtil.create('canvas', 'strike-canvas');
    leafletMap.getPane(this.options.pane || 'lightningPane').appendChild(this._canvas);
    leafletMap.on('move zoom viewreset resize', this._onViewChange);
    leafletMap.on('click', this._onClick, this);
    this._schedule();
    return this;
  },

  onRemove(leafletMap) {
    cancelAnimationFrame(this._frame);
    leafletMap.off('move zoom viewreset resize', this._onViewChange);
    leafletMap.off('click', this._onClick, this);
    this._canvas?.remove();
    this._canvas = null;
    this._map = null;
    return this;
  },

  /** Replaces the drawn set. `newKeys` marks strikes that should flash. */
  setStrikes(strikes, { end, lifespanHours, newKeys } = {}) {
    this._strikes = strikes;
    if (end) this._windowEnd = end instanceof Date ? end.getTime() : end;
    if (lifespanHours) this._lifespanMs = Math.max(1, lifespanHours * 3600 * 1000);

    if (newKeys?.size) {
      const now = performance.now();
      let budget = DEVICE.mobile ? 6 : 14;
      for (const strike of strikes) {
        if (budget <= 0) break;
        if (!newKeys.has(strike.ms)) continue;
        this._flashes.push({ lat: strike.lat, lon: strike.lon, start: now });
        budget -= 1;
      }
    }
    this._schedule();
    return this;
  },

  /**
   * Replaces the drawn set with typed-array buffers.
   *
   * Used for the bulk sources. `setStrikes` stays for the ones small enough that
   * an object each is no trouble, and the two can be shown at once.
   */
  setStrikeBuffers(buffers, { end, lifespanHours, freshSince } = {}) {
    this._buffers = buffers || [];
    if (freshSince !== undefined) this._freshSince = freshSince;
    if (end) this._windowEnd = end instanceof Date ? end.getTime() : end;
    if (lifespanHours) this._lifespanMs = Math.max(1, lifespanHours * 3600 * 1000);
    this._schedule();
    return this;
  },

  /**
   * Draws every buffered strike inside the view.
   *
   * Two things keep this cheap at two million strikes.
   *
   * **No counting pass.** Choosing between the two draw modes needs to know how
   * many strikes are on screen, and finding that out exactly meant walking every
   * buffer twice. The count from the previous frame decides instead: it is the
   * same view a sixtieth of a second earlier, and being one frame late in
   * switching mode is invisible, where walking two million entries twice is not.
   *
   * **No colour lookup per strike.** Strikes are stored in time order and the age
   * ramp is a set of time bands, so each band is a contiguous run. A binary
   * search per band per buffer replaces a comparison chain per strike, and the
   * inner loop draws a run of one colour with no branching in it at all.
   */
  _renderBuffers(ctx, size, dpr) {
    if (!this._buffers.length) return 0;

    // Leaflet's projection, inlined: at this zoom the whole world is `scale`
    // pixels across, so a normalised Mercator position is one multiply away from
    // a pixel. Anything else would put a tangent and a logarithm in this loop.
    const scale = this._map.getPixelWorldBounds().getSize().x;
    const origin = this._map.getPixelBounds().min;
    // How many are on screen decides which path draws them, and the honest way
    // to know is to count. That is two multiplies and two comparisons a strike,
    // so it is only worth avoiding when there are a great many; below that the
    // previous frame's figure is a worse answer than the real one. Using it
    // unconditionally left the first frame after a zoom drawing the old
    // decision — pixels where there was now room for shapes.
    let total = 0;
    for (const buffer of this._buffers) total += buffer.count;
    const dense = total > COUNT_EXACTLY_BELOW
      ? (this._lastVisible || 0) > DENSE_THRESHOLD
      : this._countVisible(scale, origin.x, origin.y, size) > DENSE_THRESHOLD;
    const view = {
      scale, originX: origin.x, originY: origin.y, pad: 8, w: size.x, h: size.y, dpr,
    };

    const runs = this._ageRuns();
    this._lastMode = dense ? 'splat' : 'stroke';
    const drawn = dense ? this._splatRuns(ctx, view, runs) : this._strokeRuns(ctx, view, runs);
    this._lastVisible = drawn;
    return drawn;
  },

  /** How many buffered strikes fall inside the view. */
  _countVisible(scale, originX, originY, size) {
    const pad = 8;
    let visible = 0;
    for (const buffer of this._buffers) {
      const { mx, my, count } = buffer;
      for (let i = 0; i < count; i += 1) {
        const x = mx[i] * scale - originX;
        if (x < -pad || x > size.x + pad) continue;
        const y = my[i] * scale - originY;
        if (y < -pad || y > size.y + pad) continue;
        visible += 1;
      }
    }
    return visible;
  },

  /**
   * The buffers cut into runs of one colour.
   *
   * Each run is `[buffer, from, to, colourIndex]`, and because a buffer is in
   * time order the cut points are two binary searches per band.
   */
  _ageRuns() {
    const end = this._windowEnd;
    const lifespan = this._lifespanMs;
    const fresh = this._freshSince;
    const runs = [];

    for (const buffer of this._buffers) {
      if (!buffer.count) continue;

      // Arrivals sit at the end of a time-ordered buffer, so they cut off with
      // one search and the bands are worked out over what is left.
      let top = buffer.count;
      if (fresh) {
        const from = firstAtOrAfter(buffer, fresh);
        if (from < top) {
          runs.push([buffer, from, top, FRESH_BAND]);
          top = from;
        }
      }
      if (!top) continue;

      if (!lightning.colorByAge) {
        runs.push([buffer, 0, top, -1]);
        continue;
      }
      // Age rises with time-before-`end`, so the youngest band is the newest
      // strikes: walk the stops from the newest boundary backwards.
      let to = top;
      for (let band = 0; band < AGE_STOPS.length && to > 0; band += 1) {
        const limit = AGE_STOPS[band][0];
        const from = limit === Infinity
          ? 0
          : Math.min(top, firstAtOrAfter(buffer, end - limit * lifespan));
        if (from < to) runs.push([buffer, from, to, band]);
        to = from;
      }
    }
    return runs;
  },

  /**
   * The sparse mode.
   *
   * Three mark styles, chosen per layer because the sources differ in what they
   * need to say.
   *
   * `age` is the in-house feed: a bolt for strikes in the newest age band and a
   * small open square for everything older. Shape carries the same information
   * as colour, which is the point — a field of identical crosses tinted five
   * ways makes you read the legend to find out what just happened, whereas a
   * bolt among squares is legible at a glance and survives being printed,
   * screenshotted or looked at by someone who cannot separate the hues.
   *
   * `dot` is the global feed, an order of magnitude denser, where anything with
   * structure turns to texture.
   *
   * `cross` is the plain fallback.
   */
  _strokeRuns(ctx, view, runs) {
    const { scale, originX, originY, pad, w, h } = view;
    const style = this.options.mark || 'cross';
    const small = runtime.lowEnd;
    const arm = small ? 3.5 : 4.5;
    const dot = small ? 1.6 : 2.1;
    const box = small ? 1.8 : 2.2;
    const bolt = small ? 4.2 : 5.2;
    let drawn = 0;

    // Newest last, so a fresh strike is never buried under an older one. The
    // arrivals band sorts below every age band, which puts it on top.
    const ordered = style === 'age' ? [...runs].sort((a, b) => b[3] - a[3]) : runs;

    for (const [buffer, from, to, band] of ordered) {
      const { mx, my } = buffer;
      const arrival = band === FRESH_BAND;
      const colour = arrival ? FRESH_COLOUR : (band < 0 ? STATIC_COLOUR : AGE_STOPS[band][1]);
      const filled = style === 'dot' || arrival;
      const width = style === 'age' ? (small ? 1 : 1.2) : (small ? 1.4 : 1.8);

      ctx.beginPath();
      let any = false;
      for (let i = from; i < to; i += 1) {
        const x = mx[i] * scale - originX;
        if (x < -pad || x > w + pad) continue;
        const y = my[i] * scale - originY;
        if (y < -pad || y > h + pad) continue;

        if (style === 'dot') {
          // moveTo before arc, or each dot is joined to the last by a chord.
          ctx.moveTo(x + dot, y);
          ctx.arc(x, y, dot, 0, TWO_PI);
        } else if (arrival) {
          tracePath(ctx, BOLT, x, y, bolt);
        } else if (style === 'age') {
          // `rect` opens its own subpath, so these batch without a moveTo.
          ctx.rect(x - box, y - box, box * 2, box * 2);
        } else {
          ctx.moveTo(x - arm, y - arm);
          ctx.lineTo(x + arm, y + arm);
          ctx.moveTo(x + arm, y - arm);
          ctx.lineTo(x - arm, y + arm);
        }
        any = true;
        drawn += 1;
      }
      if (!any) continue;

      // The path is built once and drawn twice: a dark outline underneath, then
      // the mark itself. Without it the newest band, which is white, disappears
      // on a light base map.
      if (style === 'age') {
        ctx.strokeStyle = MARK_HALO;
        ctx.lineWidth = width + 1.1;
        ctx.stroke();
      }
      ctx.lineWidth = width;
      if (filled) {
        ctx.fillStyle = colour;
        ctx.fill();
      } else {
        ctx.strokeStyle = colour;
        ctx.stroke();
      }
    }
    return drawn;
  },

  /**
   * The dense mode: one array write per strike, straight into an image buffer.
   *
   * At this density the canvas path API is the whole cost — two million strokes
   * is seconds, two million array writes is milliseconds. The buffer is kept
   * between frames because allocating a canvas-sized `ImageData` every frame is
   * itself a noticeable expense at 4K.
   */
  _splatRuns(ctx, view, runs) {
    const { scale, originX, originY, w: cssW, h: cssH, dpr } = view;
    const w = Math.round(cssW * dpr);
    const h = Math.round(cssH * dpr);
    if (!this._image || this._image.width !== w || this._image.height !== h) {
      this._image = ctx.createImageData(w, h);
      this._pixels = new Uint32Array(this._image.data.buffer);
    }
    const pixels = this._pixels;
    pixels.fill(0);
    // A single device pixel disappears on a dense field; a 2x2 block is what
    // makes an individual strike visible without merging its neighbours.
    const block = dpr >= 2 ? 2 : 1;
    let drawn = 0;

    for (const [buffer, from, to, band] of runs) {
      const { mx, my } = buffer;
      const colour = band === FRESH_BAND ? FRESH_PIXEL : (band < 0 ? STATIC_PIXEL : AGE_PIXELS[band]);
      for (let i = from; i < to; i += 1) {
        const px = (mx[i] * scale - originX) * dpr;
        if (px < 0 || px >= w) continue;
        const py = (my[i] * scale - originY) * dpr;
        if (py < 0 || py >= h) continue;
        const x0 = px | 0;
        const y0 = py | 0;
        for (let dy = 0; dy < block; dy += 1) {
          const row = y0 + dy;
          if (row >= h) break;
          const at = row * w + x0;
          pixels[at] = colour;
          if (block > 1 && x0 + 1 < w) pixels[at + 1] = colour;
        }
        drawn += 1;
      }
    }

    // putImageData ignores the transform, so it goes on at device scale.
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(this._image, 0, 0);
    ctx.restore();
    return drawn;
  },

  /** Rings on the strikes that arrived since the last draw. */
  flashArrivals(strikes, newKeys) {
    const now = performance.now();
    let budget = DEVICE.mobile ? 6 : 14;
    for (const strike of strikes) {
      if (budget <= 0) break;
      if (!newKeys.has(strike.ms)) continue;
      this._flashes.push({ lat: strike.lat, lon: strike.lon, start: now });
      budget -= 1;
    }
    this._schedule();
    return this;
  },

  setOpacity(value) {
    if (this._canvas) this._canvas.style.opacity = String(value);
    return this;
  },

  _schedule() {
    if (this._frame) return;
    this._frame = requestAnimationFrame(() => {
      this._frame = null;
      this._render();
    });
  },

  _render() {
    const leafletMap = this._map;
    const canvas = this._canvas;
    if (!leafletMap || !canvas) return;

    const size = leafletMap.getSize();
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    if (canvas.width !== Math.round(size.x * dpr) || canvas.height !== Math.round(size.y * dpr)) {
      canvas.width = Math.round(size.x * dpr);
      canvas.height = Math.round(size.y * dpr);
      canvas.style.width = `${size.x}px`;
      canvas.style.height = `${size.y}px`;
    }
    L.DomUtil.setPosition(canvas, leafletMap.containerPointToLayerPoint([0, 0]));

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size.x, size.y);

    const bounds = leafletMap.getBounds().pad(0.15);
    const colourByAge = lightning.colorByAge;
    const end = this._windowEnd;
    const lifespan = this._lifespanMs;
    const arm = runtime.lowEnd ? 3.5 : 4.5;

    ctx.lineWidth = runtime.lowEnd ? 1.4 : 1.8;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.92;

    // Batching by colour means at most five path/stroke pairs for the whole
    // field instead of one stroke per strike.
    const batches = new Map();

    for (let i = 0; i < this._strikes.length; i += 1) {
      const s = this._strikes[i];
      if (s.lat < bounds.getSouth() || s.lat > bounds.getNorth()) continue;
      if (s.lon < bounds.getWest() || s.lon > bounds.getEast()) continue;

      const colour = colourByAge ? colourForAge((end - s.ms) / lifespan) : STATIC_COLOUR;
      let batch = batches.get(colour);
      if (!batch) {
        batch = [];
        batches.set(colour, batch);
      }
      const point = leafletMap.latLngToContainerPoint([s.lat, s.lon]);
      batch.push(point.x, point.y);
    }

    let drawn = 0;
    for (const [colour, points] of batches) {
      drawn += points.length / 2;
      ctx.strokeStyle = colour;
      ctx.beginPath();
      for (let i = 0; i < points.length; i += 2) {
        const x = points[i];
        const y = points[i + 1];
        ctx.moveTo(x - arm, y - arm);
        ctx.lineTo(x + arm, y + arm);
        ctx.moveTo(x + arm, y - arm);
        ctx.lineTo(x - arm, y + arm);
      }
      ctx.stroke();
    }

    this._drawn = drawn + this._renderBuffers(ctx, size, dpr);
    this._renderFlashes(ctx, leafletMap);
  },

  /** How many strikes the last frame actually put on screen. */
  drawnCount() {
    return this._drawn || 0;
  },

  /** Expanding rings for strikes that arrived in the last poll. */
  _renderFlashes(ctx, leafletMap) {
    if (!this._flashes.length) return;
    const now = performance.now();
    const DURATION = 900;
    const alive = [];

    for (const flash of this._flashes) {
      const t = (now - flash.start) / DURATION;
      if (t >= 1) continue;
      alive.push(flash);
      const point = leafletMap.latLngToContainerPoint([flash.lat, flash.lon]);
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = '#fff8c4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(point.x, point.y, 4 + t * 22, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    this._flashes = alive;
    if (alive.length) this._schedule();
  },

  /** Finds the nearest strike to a click and shows its time. */
  _onClick(event) {
    const clickPoint = this._map.latLngToContainerPoint(event.latlng);
    let best = null;
    let bestDistance = 12 * 12; // squared pixels

    for (const s of this._strikes) {
      const point = this._map.latLngToContainerPoint([s.lat, s.lon]);
      const dx = point.x - clickPoint.x;
      const dy = point.y - clickPoint.y;
      const distance = dx * dx + dy * dy;
      if (distance < bestDistance) {
        bestDistance = distance;
        best = s;
      }
    }

    // The buffers hold the same thing in projected form, so the search is the
    // same two multiplies the drawing uses rather than a Leaflet call per strike.
    if (this._buffers.length) {
      const scale = this._map.getPixelWorldBounds().getSize().x;
      const origin = this._map.getPixelBounds().min;
      for (const buffer of this._buffers) {
        const { mx, my, t, base, count } = buffer;
        for (let i = 0; i < count; i += 1) {
          const dx = (mx[i] * scale - origin.x) - clickPoint.x;
          if (dx > 12 || dx < -12) continue;
          const dy = (my[i] * scale - origin.y) - clickPoint.y;
          if (dy > 12 || dy < -12) continue;
          const distance = dx * dx + dy * dy;
          if (distance < bestDistance) {
            bestDistance = distance;
            best = { ms: base + t[i], lat: latFromMercatorY(my[i]), lon: mx[i] * 360 - 180 };
          }
        }
      }
    }
    if (!best) return;

    L.popup({ className: 'wx-popup-shell', closeButton: true })
      .setLatLng([best.lat, best.lon])
      .setContent(
        `<div class="wx-popup"><header class="wx-popup__head" style="--accent:#ffd700">
           <strong>Lightning strike</strong></header>
         <dl class="wx-popup__rows">
           <dt>Time</dt><dd>${new Date(best.ms).toISOString().replace('T', ' ').slice(0, 19)} UTC</dd>
           <dt>Position</dt><dd>${best.lat.toFixed(3)}, ${best.lon.toFixed(3)}</dd>
         </dl></div>`,
      )
      .openOn(this._map);
  },
});

/* ------------------------------------------------------------------ *
 * Controller
 * ------------------------------------------------------------------ */

let layer = null;
let previousKeys = new Set();

function ensureStrikeLayer() {
  if (!layer) layer = new StrikeCanvasLayer({ pane: 'lightningPane', mark: 'age' });
  if (!map.hasLayer(layer)) layer.addTo(map);
  return layer;
}

function removeStrikeLayer() {
  if (layer && map.hasLayer(layer)) map.removeLayer(layer);
}

/**
 * Draws a filtered set.
 *
 * The strikes are packed into a typed buffer and handed to the same path the
 * global feed uses. That does two things at once: the shaped marks live there,
 * and so does the drawing of every strike. This used to decimate above a render
 * ceiling — on a busy day you were looking at a sample of the field, thinned by
 * a stride, with no indication that anything was missing.
 */
function drawStrikes(filtered, { end, lifespanHours }) {
  if (!lightning.showLayer) {
    removeStrikeLayer();
    return { drawn: 0, fresh: 0 };
  }

  const keys = new Set();
  const fresh = new Set();
  for (const s of filtered) {
    keys.add(s.ms);
    if (!previousKeys.has(s.ms)) fresh.add(s.ms);
  }
  previousKeys = keys;

  // The most recent minute of whatever is being shown. Tying this to what
  // arrived on the last refresh instead made it a property of the polling rather
  // than of the weather: a quiet refresh marked nothing, a slow one marked
  // several minutes, and scrubbing an archive marked nothing at all because
  // nothing had arrived. A minute before the window's end is the same question
  // asked of live data and of last June.
  const freshSince = end - FRESH_WINDOW_MS;

  const layerRef = ensureStrikeLayer();
  layerRef.setStrikeBuffers(filtered.length ? [packStrikes(filtered)] : [], {
    end, lifespanHours, freshSince,
  });

  // The arrival flash still works from the objects: it is a handful of rings,
  // and it needs positions rather than a scan of the whole field.
  if (fresh.size) layerRef.flashArrivals(filtered, fresh);

  return { drawn: filtered.length, fresh: fresh.size, decimated: false };
}

/**
 * Packs strikes into the typed form the renderer draws from.
 *
 * Positions are projected here, once, rather than per frame — Web Mercator costs
 * a logarithm and a tangent each, and a frame should not be paying for those.
 */
function packStrikes(strikes) {
  const sorted = strikes[0] && strikes[strikes.length - 1].ms >= strikes[0].ms
    ? strikes
    : [...strikes].sort((a, b) => a.ms - b.ms);
  const base = sorted[0].ms;
  const count = sorted.length;
  const mx = new Float32Array(count);
  const my = new Float32Array(count);
  const t = new Uint32Array(count);
  for (let i = 0; i < count; i += 1) {
    mx[i] = mercatorX(sorted[i].lon);
    my[i] = mercatorY(sorted[i].lat);
    t[i] = Math.max(0, sorted[i].ms - base);
  }
  return { mx, my, t, base, count };
}

/** Forces a redraw after a colour-mode change, without refiltering. */
function refreshColours() {
  layer?._schedule();
}

const getStrikeLayer = () => layer;

  let ssTotLat = 0, ssResLat = 0, ssTotLon = 0, ssResLon = 0, residualSum = 0;

  for (const b of bins) {
    const t = (b.time - baseTime) / 1000;
    const w = weightOf(b);
    const predLat = interceptLat + slopeLat * t;
    const predLon = interceptLon + slopeLon * t;
    ssTotLat += w * (b.lat - meanLat) ** 2;
    ssTotLon += w * (b.lon - meanLon) ** 2;
    ssResLat += w * (b.lat - predLat) ** 2;
    ssResLon += w * (b.lon - predLon) ** 2;
    residualSum += haversineKm(b.lat, b.lon, predLat, predLon) * w;
  }

  const r2 = ((ssTotLat > 0 ? 1 - ssResLat / ssTotLat : 0) + (ssTotLon > 0 ? 1 - ssResLon / ssTotLon : 0)) / 2;
  return { slopeLat, slopeLon, interceptLat, interceptLon, r2, residualKm: residualSum / sumW };
}

/** RANSAC wrapper: resists a few stray cells dragging the vector off. */
function ransacRegression(bins, iterations, threshold, decayConstant) {
  let best = { slopeLat: 0, slopeLon: 0, interceptLat: 0, interceptLon: 0, r2: 0, residualKm: 100 };
  let mostInliers = 0;

  for (let i = 0; i < iterations; i += 1) {
    const sample = randomSample(bins, 2);
    if (sample.length < 2) continue;
    const model = fitLinearModel(sample, decayConstant);
    const inliers = bins.filter((b) => {
      const t = (b.time - sample[0].time) / 1000;
      return Math.abs(b.lat - (model.interceptLat + model.slopeLat * t)) < threshold &&
        Math.abs(b.lon - (model.interceptLon + model.slopeLon * t)) < threshold;
    });
    if (inliers.length > mostInliers) {
      mostInliers = inliers.length;
      best = fitLinearModel(inliers.length >= 2 ? inliers : sample, decayConstant);
    }
  }
  return best;
}

/* ------------------------------------------------------------------ *
 * Main calculation
 * ------------------------------------------------------------------ */


/* ------------------------------------------------------------------ *
 * Radar advection
 * ------------------------------------------------------------------ */

/**
 * Motion measured from the radar field, cached by area.
 *
 * The nowcast has to stay synchronous — it runs on the draw path — so radar is
 * consulted from a cache and refreshed behind it. A cluster with no hint yet
 * behaves exactly as it did before radar was involved, and improves on the next
 * refresh. That is also what keeps the whole thing optional: no radar frames, no
 * hint, no change.
 *
 * Keyed on a quarter-degree cell, which is about 25 km. Storms inside one cell
 * are steered by the same flow, so sharing a measurement between them is not an
 * approximation worth avoiding — and it means a squall line of six clusters
 * costs one pair of radar windows rather than six.
 */
const hints = new Map();
const pending = new Set();

/** How long a measurement is trusted before it is taken again. */
const HINT_TTL_MS = 8 * 60 * 1000;

const hintKey = (lat, lon) => `${Math.round(lat * 4)}|${Math.round(lon * 4)}`;

/** The cached measurement for a position, if it is still fresh. */
function radarHintFor(lat, lon, referenceMs) {
  const hint = hints.get(hintKey(lat, lon));
  if (!hint) return null;
  return Math.abs(referenceMs - hint.at) <= HINT_TTL_MS ? hint : null;
}

/**
 * Measures anything missing, in the background.
 *
 * The result is not returned: it lands in the cache and the listener is told, so
 * whoever is drawing can ask again. Failures are cached as a null measurement so
 * a region out of radar coverage is not retried on every pass.
 */
function refreshRadarHints(positions, referenceMs) {
  for (const [lat, lon] of positions) {
    const key = hintKey(lat, lon);
    if (pending.has(key)) continue;
    const existing = hints.get(key);
    if (existing && Math.abs(referenceMs - existing.at) <= HINT_TTL_MS) continue;

    pending.add(key);
    measureMotion(lat, lon, referenceMs)
      .then((measured) => {
        hints.set(key, measured ? { ...measured, at: referenceMs } : { at: referenceMs, quality: 0 });
        if (measured) {
          // The memo is keyed on the strikes and the minute, neither of which
          // changed; without this the next call would hand back the answer that
          // was computed before the radar arrived.
          memoKey = '';
          // And something has to ask again. This used to announce itself on the
          // filtered-strikes event, which only the timeline footer listens to,
          // so the measurement landed, the memo cleared, and nothing recomputed
          // — the first pass has no radar by construction, because the hints for
          // a cluster are requested only once that cluster exists. A storm with
          // an obvious hail core stayed drawn as an ordinary tracked cell until
          // some unrelated redraw happened by.
          emit(EVENTS.NOWCAST_RADAR, { reason: 'radar-motion' });
        }
      })
      .catch(() => { hints.set(key, { at: referenceMs, quality: 0 }); })
      .finally(() => pending.delete(key));
  }
}

/** Angular difference between two bearings, 0 to 180. */
function bearingGap(a, b) {
  const d = Math.abs(((a - b) % 360 + 540) % 360 - 180);
  return 180 - d;
}

/** Forgets every measurement. For tests, and when the view changes wholesale. */
function resetRadarHints() {
  hints.clear();
  pending.clear();
  resetRadarMotion();
}

/** What the nowcast knows from radar right now. For diagnostics and checks. */
/**
 * Plants a measurement, for the checks.
 *
 * The blend between radar and the strike track is the part of this worth
 * testing and the hardest to arrange: it needs a real storm under real radar
 * coverage at a moment the archive still holds. Seeding one turns that into an
 * ordinary check.
 */
function seedRadarHint(lat, lon, measurement, atMs = Date.now()) {
  hints.set(hintKey(lat, lon), { ...measurement, at: atMs });
}

const radarHints = () => [...hints.entries()].map(([key, value]) => ({ key, ...value }));



/**
 * Time-binned centroids for a cluster, and the motion fitted through them.
 *
 * Pulled out of the main loop so the clustering can use it too. Separating cells
 * needs to know how fast they are travelling, and knowing that needs a fit, so
 * the first pass fits coarse clusters only to work out the flow, and the second
 * uses that flow to cluster properly.
 */
function fitCluster(cluster, { binSize, decayConstant, ransacIterations }) {
  let minTime = Infinity;
  let maxTime = -Infinity;
  for (const s of cluster) {
    if (s.ms < minTime) minTime = s.ms;
    if (s.ms > maxTime) maxTime = s.ms;
  }

  const bins = [];
  for (let t = minTime; t < maxTime; t += binSize) {
    let sumLat = 0;
    let sumLon = 0;
    let sumW = 0;
    let count = 0;
    for (const s of cluster) {
      if (s.ms < t || s.ms >= t + binSize) continue;
      const ageRatio = maxTime > minTime ? (maxTime - s.ms) / (maxTime - minTime) : 0;
      const w = 1 - ageRatio * decayConstant;
      sumLat += s.lat * w;
      sumLon += s.lon * w;
      sumW += w;
      count += 1;
    }
    if (count) bins.push({ time: t + binSize / 2, lat: sumLat / sumW, lon: sumLon / sumW, count });
  }

  const result = {
    bins, minTime, maxTime, speedKmH: 0, directionDeg: 0, regressionScore: 0.1, residualKm: 100,
  };
  if (bins.length < 2) return result;

  const spanHours = (maxTime - minTime) / 3600000;
  const threshold = Math.max(0.03, Math.min(0.1, 0.05 + spanHours * 0.02));
  const model = ransacRegression(bins, ransacIterations, threshold, decayConstant);
  const latFactor = Math.cos((bins[0].lat * Math.PI) / 180);
  const vLat = model.slopeLat * 111 * 3600;
  const vLon = model.slopeLon * 111 * latFactor * 3600;

  result.regressionScore = model.r2;
  result.residualKm = model.residualKm;
  result.speedKmH = Math.min(Math.hypot(vLat, vLon), MAX_SPEED_KMH);
  result.directionDeg = (Math.atan2(vLon, vLat) * 180) / Math.PI % 360;
  if (result.directionDeg < 0) result.directionDeg += 360;
  return result;
}

/**
 * The flow the whole field is travelling in, fitted from the lightning alone.
 *
 * A first clustering pass with no motion to work from produces blobs: a cell's
 * three-hour track spreads across more ground than the gap to its neighbours, so
 * neighbouring cells chain into one. Those blobs are useless as cells and
 * perfectly good for measuring the flow, which is all this asks of them. The
 * second pass uses the answer to put every strike in the storm's frame, where
 * cells actually separate.
 *
 * Weighted by cluster size and by how well each fit held, so one small erratic
 * cluster cannot steer the field.
 */
function steeringFromLightning(clusters, fitOptions) {
  let u = 0;
  let v = 0;
  let weight = 0;
  for (const cluster of clusters) {
    const fit = fitCluster(cluster, fitOptions);
    if (fit.bins.length < 3 || fit.speedKmH < 5) continue;
    const w = cluster.length * Math.max(0.1, fit.regressionScore);
    const rad = (fit.directionDeg * Math.PI) / 180;
    u += Math.sin(rad) * fit.speedKmH * w;
    v += Math.cos(rad) * fit.speedKmH * w;
    weight += w;
  }
  if (!weight) return null;
  u /= weight;
  v /= weight;
  const speedKmH = Math.hypot(u, v);
  if (speedKmH < 5) return null;
  return { speedKmH, directionDeg: (Math.atan2(u, v) * 180 / Math.PI + 360) % 360, quality: 0.4 };
}

/* ------------------------------------------------------------------ *
 * How long a cell has left
 * ------------------------------------------------------------------ */

/** Flash rate below which a cell is no longer worth projecting, per minute. */
const SPENT_RATE = 0.5;

/** Bounds on the answer. Nothing useful is said outside them. */
const MIN_LIFE_MIN = 5;
const MAX_LIFE_MIN = 120;

/**
 * Minutes of useful life left in a cell.
 *
 * The old code had no estimate at all. It projected every cluster to the same
 * horizon and let an inactivity decay fade the confidence, which says a storm is
 * ending only once it has already stopped — too late to be a forecast.
 *
 * The rate of flashes is treated as changing exponentially, which is a fair
 * description of a convective cell over the half hour that matters here.
 * Measuring that rate of change over two windows gives a growth constant, and
 * the remaining life is the time for the rate to fall to nothing much. A growing
 * cell instead gets what is left of a typical lifetime for its age, because
 * extrapolating growth forward says a cell will last for ever.
 *
 * Radar's area trend is folded in where there is one: it is a direct measurement
 * of the same thing, and it moves before the flash rate does.
 *
 * @param {object} counts  flashes in the last window and the one before it
 * @param {number} windowMin  length of each window, in minutes
 * @param {number} ageMin  how long the cell has been producing strikes
 * @param {number} silentMin  minutes since its last strike
 * @param {number|null} radarTrend  ratio of convective area between radar frames
 */
function remainingLifeMinutes({ latest, previous }, windowMin, ageMin, silentMin, radarTrend) {
  const rateNow = latest / windowMin;
  const ratePrev = previous / windowMin;

  // Growth constants, per minute. Both are logs of a ratio over a known span.
  const fromFlashes = rateNow > 0 && ratePrev > 0 ? Math.log(rateNow / ratePrev) / windowMin : null;
  const fromRadar = radarTrend > 0 ? Math.log(radarTrend) / SEPARATION_MIN : null;

  let k;
  if (fromFlashes !== null && fromRadar !== null) k = fromFlashes * 0.45 + fromRadar * 0.55;
  else k = fromFlashes ?? fromRadar ?? 0;

  // Already quiet: what is left is what is left of the silence allowance.
  if (rateNow <= 0) return Math.max(0, Math.round(MIN_LIFE_MIN - silentMin));

  // What a steady cell of this age would have left. It is also the ceiling on a
  // decaying one: extrapolating a gentle decline from a high flash rate gave a
  // collapsing storm a longer life than a healthy one, which cannot be right.
  const typical = ageMin > 60 ? 45 : 55;
  const steadyCeiling = Math.max(MIN_LIFE_MIN, typical - ageMin * 0.35);

  let minutes;
  if (k < -0.005) {
    minutes = Math.min(steadyCeiling, Math.log(SPENT_RATE / rateNow) / k);
  } else {
    // Steady or growing. An ordinary cell runs about an hour; a cluster that has
    // already lasted longer than that is a multicell system and gets more, but
    // not without limit.
    minutes = steadyCeiling * (k > 0.01 ? 1.35 : 1);
  }

  if (!Number.isFinite(minutes)) minutes = MIN_LIFE_MIN;
  return Math.round(Math.max(MIN_LIFE_MIN, Math.min(MAX_LIFE_MIN, minutes)));
}

/**
 * How much more a radar-measured motion is worth than a strike-fitted one.
 *
 * Four means radar has to be four times worse before the two are even. At its
 * quality floor it still carries about 60% of a good lightning fit; a clean
 * correlation against a weak track is over 95%.
 */
/**
 * The reflectivities the hail scale is stretched between, in dBZ.
 *
 * Set from what this composite actually reports rather than from the
 * single-polarisation textbook, whose 50-and-60 assume a native radar. Measured
 * over the eight busiest lightning cells inside its coverage, storms peak at 55
 * to 62 and the share of pixels above 60 runs from 0.17% to 2.3%. The textbook
 * numbers were not unreachable, but they left an ordinary storm peaking near 50
 * scoring 0.24 against a floor of 0.3 — so it never fired at all, which is the
 * complaint that led here.
 */
const HAIL_FLOOR_DBZ = 42;
const HAIL_FULL_DBZ = 58;

/** Share of the window above 60 dBZ that counts as a full-sized hail core. */
const HAIL_CORE_SHARE = 0.015;

const RADAR_MOTION_WEIGHT = 4;

/** Strikes the steering pass runs on. It needs a direction, not a cell list. */
const COARSE_PASS_BUDGET = 1500;

const MAX_SPEED_KMH = 80;
let previousNowcasts = [];
let lastRaw = [];

/** The fitted vectors from the last run, before smoothing. Diagnostics only. */
const nowcastInternals = () => lastRaw;

let memoKey = '';
let memoResult = [];

/**
 * Produces the cluster projections for a filtered strike set.
 * @param {Array} strikes  filtered strikes, ascending by time
 * @param {Date}  reference the "now" the projection is made from
 */
function calculateNowcast(strikes, reference = new Date()) {
  if (!strikes?.length) return [];

  const p = profile();
  // Positions belong in the key as well as times. Two sets with the same count
  // and the same first and last timestamps were treated as the same input, which
  // is wrong however unlikely — and not unlikely at all for anything generated,
  // where three tracks heading in three directions all came back as the first
  // one. Sampling a dozen strikes is enough to tell them apart without hashing
  // the lot on every draw.
  let shape = 0;
  const stride = Math.max(1, Math.floor(strikes.length / 12));
  for (let i = 0; i < strikes.length; i += stride) {
    shape = (shape * 31 + Math.round(strikes[i].lat * 1000) + Math.round(strikes[i].lon * 1000) * 7) % 2147483647;
  }
  const key = [
    strikes.length,
    strikes[0].ms,
    strikes[strikes.length - 1].ms,
    shape,
    Math.floor(reference.getTime() / 60000),
    p.maxInput, p.maxClusters, p.ransacMax, p.steps.join('-'),
  ].join('|');
  if (key === memoKey) return memoResult;

  const referenceMs = reference.getTime();

  // Density drives the clustering window: busy days want tighter, more precise
  // clusters; quiet days want a longer memory so a slow cell is not dropped.
  let recent = strikes.filter((s) => referenceMs - s.ms <= 7 * 3600 * 1000);
  const rawCount = recent.length;
  recent = thinAcrossTime(recent, p.maxInput);

  const densityRatio = Math.min(1, rawCount / 2000);
  const baseMaxHours = 6 - 2 * densityRatio;

  let timePenalty = 1;
  if (densityRatio < 0.4) timePenalty = 0.6 + 0.4 * (densityRatio / 0.4) ** 1.5;
  const recentStrikes = recent.filter((s) => referenceMs - s.ms <= 3 * 3600 * 1000);
  if (recentStrikes.length / 3 > 8) timePenalty = Math.max(timePenalty, 0.85);

  const maxTimeRange = baseMaxHours * 3600 * 1000 * timePenalty;
  const maxDistance = Math.max(15, Math.min(40, 35 - 15 * (1 - densityRatio)));
  const minClusterSize = Math.max(4, Math.floor(5 + 4 * densityRatio));
  const maxInactivityMs = Math.max(10 * 60 * 1000, 25 * 60 * 1000 * (1 - densityRatio * 0.4));
  const maxTemporalSeparation = Math.max(10 * 60 * 1000, 30 * 60 * 1000 * (1 - densityRatio * 0.6));
  const ransacIterations = Math.min(p.ransacMax, 25 + Math.floor(rawCount / 18));
  const decayConstant = 0.5 + 0.1 * densityRatio;
  const binSize = 5 * 60 * 1000;
  const jumpWindow = 10 * 60 * 1000;

  const inWindow = recent.filter((s) => referenceMs - s.ms <= maxTimeRange);
  const input = thinAcrossTime(inWindow, p.maxInput);
  // Rates are measured off the thinned set, so they have to be scaled back to
  // what the network actually recorded or a busy day reads as a quiet one.
  const sampleFactor = input.length ? inWindow.length / input.length : 1;

  const fitOptions = { binSize, decayConstant, ransacIterations };

  /* ---- the storm's frame ---- */

  // One steering estimate for the whole field. Radar first, because it measures
  // the flow directly; the lightning's own first-pass fit otherwise, which needs
  // no radar coverage and is what makes cell separation work at all on an
  // archived day.
  let sumLat = 0;
  let sumLon = 0;
  for (const s of input) {
    sumLat += s.lat;
    sumLon += s.lon;
  }
  const centreLat = input.length ? sumLat / input.length : null;
  const centreLon = input.length ? sumLon / input.length : null;
  const fromRadar = centreLat === null ? null : radarHintFor(centreLat, centreLon, referenceMs);
  if (centreLat !== null) refreshRadarHints([[centreLat, centreLon]], referenceMs);

  // Radar first, and not only as a fallback ordering: it is the better estimate
  // for the same reason it is weighted higher in the blend below.
  let steering = fromRadar && fromRadar.quality > 0 ? fromRadar : null;
  if (!steering) {
    // A pass with nothing to advect by produces blobs rather than cells, which
    // is useless as an answer and perfectly good for measuring the flow. Since
    // all it has to produce is one field-wide vector, it runs on a sample: the
    // blobs come out the same shape and the pass costs a fraction of the one
    // that matters.
    const coarse = clusterStrikes(thinAcrossTime(input, COARSE_PASS_BUDGET), {
      minClusterSize, maxDistance, maxTemporalSeparation, minNeighbours: 3,
    }).sort((a, b) => b.length - a.length).slice(0, 6);
    steering = steeringFromLightning(coarse, fitOptions);
  }

  /**
   * Carries a strike to where the storm that made it would be now.
   *
   * Clustering then measures the gap between cells rather than the ground each
   * has covered, which is the difference between separating two cells and
   * merging a single moving one.
   */
  const advect = steering && steering.speedKmH > 3
    ? (lat, lon, ms) => {
      const hours = (referenceMs - ms) / 3600000;
      const km = steering.speedKmH * hours;
      const rad = (steering.directionDeg * Math.PI) / 180;
      return [
        lat + (km * Math.cos(rad)) / KM_PER_DEG_LAT,
        lon + (km * Math.sin(rad)) / (KM_PER_DEG_LAT * Math.max(0.1, Math.cos((lat * Math.PI) / 180))),
      ];
    }
    : null;

  // In the storm's frame a cell's own strikes sit on top of one another, so the
  // radius that separates neighbours can be much tighter than the one that had
  // to tolerate hours of travel.
  const joinKm = advect ? Math.max(8, maxDistance * 0.4) : maxDistance;
  const minNeighbours = Math.max(2, Math.round(3 + densityRatio * 3));

  const clusters = clusterStrikes(input, {
    minClusterSize, maxDistance: joinKm, maxTemporalSeparation, advect, minNeighbours,
  })
    .sort((a, b) => b.length - a.length)
    .slice(0, p.maxClusters);

  const raw = [];
  const MIN_BINS_FOR_CONFIDENCE = 5;

  for (const cluster of clusters) {
    const fit = fitCluster(cluster, fitOptions);
    const { bins, minTime, maxTime } = fit;
    const sinceLast = referenceMs - maxTime;
    if (sinceLast > maxInactivityMs) continue;
    if (!bins.length) continue;

    let speedKmH = fit.speedKmH;
    let directionDeg = fit.directionDeg;
    const regressionScore = fit.regressionScore;
    const residualKm = fit.residualKm;

    const bearings = [];
    for (let i = 1; i < bins.length; i += 1) {
      bearings.push(bearingDeg(bins[i - 1].lon, bins[i - 1].lat, bins[i].lon, bins[i].lat));
    }
    const consistency = 1 - circularStdDev(bearings) / 90;

    const baseLat = bins[bins.length - 1].lat;
    const baseLon = bins[bins.length - 1].lon;

    /* ---- radar ---- */
    const radar = radarHintFor(baseLat, baseLon, referenceMs);
    const lightningSpeed = speedKmH;
    const lightningDirection = directionDeg;

    // How much the lightning-only fit deserves to be believed. A cluster with
    // one bin has no fit at all, which is the case radar helps most.
    const lightningQuality = bins.length < 2
      ? 0
      : Math.max(0, Math.min(1, regressionScore * 0.5 + consistency * 0.5)) * Math.min(1, bins.length / 4);

    let radarAgreement = 0;
    if (radar && radar.quality > 0) {
      // Blended as vectors, weighted by how much each estimate has earned. Two
      // bearings cannot be averaged arithmetically — north-by-one-degree and
      // north-by-minus-one average to south — and the speeds want combining too.
      //
      // Radar counts for several times what the strike track does, and the
      // reason is in what each one measures. Radar correlates the precipitation
      // field against itself a quarter of an hour later: it is the displacement
      // of the storm, measured directly, from tens of thousands of pixels. The
      // strike track is the drift of a centroid of discharges, and discharges
      // are scattered across the whole convective area more or less at random —
      // a cell producing six flashes in five minutes moves its centroid
      // kilometres for reasons that have nothing to do with where it is going.
      // Weighting them by their own fitted quality alone treated a tidy fit of
      // noise as the equal of a measurement.
      const weight = (radar.quality * RADAR_MOTION_WEIGHT)
        / (radar.quality * RADAR_MOTION_WEIGHT + lightningQuality + 1e-6);
      const toRad = Math.PI / 180;
      const u = lightningSpeed * Math.sin(lightningDirection * toRad) * (1 - weight)
        + radar.speedKmH * Math.sin(radar.directionDeg * toRad) * weight;
      const v = lightningSpeed * Math.cos(lightningDirection * toRad) * (1 - weight)
        + radar.speedKmH * Math.cos(radar.directionDeg * toRad) * weight;
      speedKmH = Math.min(Math.hypot(u, v), MAX_SPEED_KMH);
      directionDeg = (Math.atan2(u, v) * 180 / Math.PI + 360) % 360;

      // Two independent measurements agreeing is worth more than either alone.
      if (lightningQuality > 0.15 && lightningSpeed > 5) {
        radarAgreement = Math.max(0, Math.cos(bearingGap(lightningDirection, radar.directionDeg) * toRad));
      }
    }

    // A "lightning jump" — a sudden rate increase — usually precedes intensification.
    const cutoff = referenceMs - jumpWindow;
    const latest = cluster.filter((s) => s.ms >= cutoff).length;
    const middle = cluster.filter((s) => s.ms < cutoff && s.ms >= cutoff - jumpWindow).length;
    const jump = latest > 2.5 * middle && latest >= 6;

    // Whether the convective area is growing is a thing radar measures directly.
    // The flash-rate jump stays as the fallback, and as corroboration.
    const windowMin = jumpWindow / 60000;
    const flashesPerMinute = (latest * sampleFactor) / windowMin;
    const impact = impactLevel({ flashesPerMinute, peakDbz: radar?.peakDbz ?? null, jump });
    const hail = hailRisk({
      flashesPerMinute,
      peakDbz: radar?.peakDbz ?? null,
      largeHailArea: radar?.largeHailArea ?? 0,
      jump,
    });

    const lifeMinutes = remainingLifeMinutes(
      { latest, previous: middle },
      jumpWindow / 60000,
      (maxTime - minTime) / 60000,
      sinceLast / 60000,
      radar?.trend ?? null,
    );

    const growing = radar && radar.trend !== undefined
      ? radar.trend > 1.15 || (jump && radar.trend > 0.95)
      : jump;
    const shrinking = radar && radar.trend !== undefined ? radar.trend < 0.85 : null;

    const decayFactor = (1 - Math.min(sinceLast / maxInactivityMs, 1)) ** 2;
    const sizeScore = Math.min(cluster.length / 50, 1);
    const binMultiplier = Math.min(1, (bins.length / MIN_BINS_FOR_CONFIDENCE) * (1 + 0.1 * sizeScore));

    let confidence = sizeScore * 0.15 +
      (speedKmH / MAX_SPEED_KMH) * 0.05 +
      regressionScore * 0.30 +
      consistency * 0.35 +
      (bins.length / MIN_BINS_FOR_CONFIDENCE) * 0.10;
    confidence *= decayFactor * binMultiplier;
    confidence = Math.min(1, confidence + (jump ? 0.35 : 0));
    // A measured motion is evidence in its own right, and one that agrees with
    // the lightning track is better evidence than either on its own.
    if (radar && radar.quality > 0) {
      confidence = Math.min(1, confidence + radar.quality * 0.15 + radarAgreement * radar.quality * 0.15);
    }

    raw.push({
      cluster,
      baseLat,
      baseLon,
      speedKmH, directionDeg, regressionScore, consistency, residualKm,
      confidence, clusterSize: cluster.length, bins: bins.length,
      jump, growing, lifeMinutes, flashesPerMinute, impact, hail,
      decaying: shrinking === null ? decayFactor < 0.5 : shrinking || decayFactor < 0.5,
      radar,

function optionsFor(group) {

  // Default to the first real product so enabling the toggle shows something —
  // and do the same when the remembered one is no longer offered, which happens
  // when a product is retired between sessions. A `select` cannot display a
  // value that is not among its options: it would render blank and lose the
  // selection at the first interaction.

    group,
    title: LAYER_LABELS[group] || group,
    accent: ACCENTS[group] || 'var(--accent)',
    options,
    value: slot.type,
    enabled: slot.enabled,
    opacity: slot.opacity,
    onToggle: (enabled) => setLayerEnabled(group, enabled),

      toast('This browser has no location support', { tone: 'error' });
      return;
    }
    byId('btn-locate')?.classList.add('btn--busy');
    navigator.geolocation.getCurrentPosition(
      (position) => {
        byId('btn-locate')?.classList.remove('btn--busy');
        showLocation(position);
      },
      () => {
        byId('btn-locate')?.classList.remove('btn--busy');
        toast('Could not determine your location', { tone: 'error' });
      },
      { enableHighAccuracy: true, timeout: 8000 },
    );
  });
}

/* ------------------------------------------------------------------ *
 * Your location
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ *
 * Station cards in 3D
 * ------------------------------------------------------------------ */

/**
 * Slides the camera until an open popup fits on screen.
 *
 * Leaflet pans for its own popups; Mapbox does not, and this card grows to
 * roughly four hundred pixels once the history arrives, which runs off the
 * bottom of the map from anywhere below the middle of it.
 */
function panPopupIntoView(glMap, popup, margin = 16) {
  const element = popup.getElement();
  const canvas = glMap.getCanvas();
  if (!element || !canvas) return;
  const card = element.getBoundingClientRect();
  const view = canvas.getBoundingClientRect();
  // Positive means the popup hangs off that edge by that many pixels.
  const dx = Math.max(0, view.left + margin - card.left) - Math.max(0, card.right - view.right + margin);
  const dy = Math.max(0, view.top + margin - card.top) - Math.max(0, card.bottom - view.bottom + margin);
  if (!dx && !dy) return;
  glMap.panBy([-dx, -dy], { duration: 220 });
}

/**
 * Opens the card for a station, in whichever view is showing.
 *
 * 2D and 3D need different popups — one is Leaflet's, one is Mapbox's — but the
 * card itself is the same DOM either way, and both have the same problem: it
 * opens one line tall and grows by several hundred pixels when the history
 * lands, so both are told to re-measure then.
 */
function openStationCard(station, glMap = null) {
  if (glMap) {
    const popup = new mapboxgl.Popup({
      className: 'wxcard-shell', maxWidth: '360px', closeButton: true, offset: 14,
    }).setLngLat([station.lon, station.lat]);
    popup.setDOMContent(buildStationCard(station, {
      // Mapbox recomputes the anchor on a position change, so setting the
      // position it already has is how it is asked to look again — and then the
      // camera is nudged, because unlike Leaflet's it will not do that itself
      // and the card is taller than the space below a mid-screen station.
      onReady: () => {
        if (!popup.isOpen()) return;
        popup.setLngLat(popup.getLngLat());
        panPopupIntoView(glMap, popup);
      },
    }));
    popup.addTo(glMap);
    return;
  }
  const popup = L.popup({ className: 'wxcard-shell', maxWidth: 360, autoPanPadding: [24, 24] })
    .setLatLng([station.lat, station.lon]);
  popup.setContent(buildStationCard(station, { onReady: () => popup.update() }));
  popup.openOn(map);
}

/**
 * Makes the station plots clickable on the GL map.
 *
 * The plots reach 3D as a picture — the 2D canvas, captured and draped over the
 * scene — so there is nothing there to hit-test and Leaflet never sees the
 * click. The stations' positions are known, though, and GL can project them, so
 * the nearest one to the pointer is found in screen space the same way the 2D
 * path finds it. Only the stations that survived thinning are considered: the
 * rest are not drawn, and a card for a plot nobody can see is a magic trick.
 *
 * `style.load` fires again on every restyle, so the handler is bound per map
 * instance rather than per event.
 */
let clickableGl = null;
function bindStationClicks3D(glMap) {
  if (!glMap || clickableGl === glMap) return;
  clickableGl = glMap;
  glMap.on('click', (event) => {
    if (!synoptic.options.enabled) return;
    let best = null;
    let bestDistance = 26;
    for (const station of synoptic.plottedStations()) {
      const at = glMap.project([station.lon, station.lat]);
      const distance = Math.hypot(at.x - event.point.x, at.y - event.point.y);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = station;
      }
    }
    if (best) openStationCard(best, glMap);
  });
  glMap.on('mousemove', (event) => {
    if (!synoptic.options.enabled) return;
    const near = synoptic.plottedStations().some((station) => {
      const at = glMap.project([station.lon, station.lat]);
      return Math.hypot(at.x - event.point.x, at.y - event.point.y) < 26;
    });
    glMap.getCanvas().style.cursor = near ? 'pointer' : '';
  });
}

/**
 * Marks where the browser thinks the user is.
 *
 * The previous version dropped a bare Leaflet popup reading "Your location",
 * which carried none of the application's styling, and added a fresh marker on
 * every press so they piled up. This reuses one marker, shows the accuracy the
 * fix actually has — a 3 km fix and a 30 m fix mean very different things — and
 * uses the same popup shell as every other feature on the map.
 */
let locationMarker = null;
let locationHalo = null;

function formatAccuracy(metres) {
  if (!Number.isFinite(metres)) return 'accuracy unknown';
  return metres >= 1000
    ? `± ${(metres / 1000).toFixed(metres >= 10000 ? 0 : 1)} km`
    : `± ${Math.round(metres)} m`;
}

function showLocation(position) {
  const { latitude, longitude, accuracy } = position.coords;
  const at = [latitude, longitude];

  map.flyTo(at, Math.max(map.getZoom(), 8), { duration: 0.8 });

  // The accuracy halo is a real circle in metres, so it shrinks and grows with
  // the zoom the way the uncertainty actually does.
  if (locationHalo) safeRemove(locationHalo);
  if (Number.isFinite(accuracy) && accuracy > 0) {
    locationHalo = L.circle(at, {
      radius: accuracy,
      pane: 'labelsPane',
      className: 'locate-halo',
      color: '#38bdf8',
      weight: 1,
      opacity: 0.5,
      fillColor: '#38bdf8',
      fillOpacity: 0.1,
      interactive: false,
    }).addTo(map);
  }

  if (locationMarker) safeRemove(locationMarker);
  locationMarker = L.circleMarker(at, {
    radius: 7,
    pane: 'labelsPane',
    color: '#fff',
    weight: 2,
    fillColor: '#38bdf8',
    fillOpacity: 1,
    className: 'locate-dot',
  }).addTo(map);

  locationMarker.bindPopup(`
    <div class="wx-popup">
      <header class="wx-popup__head" style="--accent:#38bdf8">
        <strong>Your location</strong>
      </header>
      <dl class="wx-popup__rows">
        <dt>Latitude</dt><dd>${latitude.toFixed(4)}°</dd>
        <dt>Longitude</dt><dd>${longitude.toFixed(4)}°</dd>
        <dt>Accuracy</dt><dd>${formatAccuracy(accuracy)}</dd>
      </dl>
    </div>`, { className: 'wx-popup-shell', closeButton: true }).openPopup();
}

/* ------------------------------------------------------------------ *
 * Cross-cutting wiring
 * ------------------------------------------------------------------ */

function bindEvents() {
  // The single place a time change turns into a weather re-render.
  on(EVENTS.TIME_COMMITTED, (timestamp) => renderAll(timestamp));

  // Resume any render that was deferred while the map was being manipulated.
  on(EVENTS.MAP_INTERACTION, ({ interacting }) => {
    if (!interacting) flushPending();
  });

  on(EVENTS.LAYER_TOGGLED, persistSession);
  on(EVENTS.LAYER_SELECTED, persistSession);

  // A dark base map wants the dark UI theme; keep them in step unless the user
  // has explicitly chosen otherwise.
  on(EVENTS.BASEMAP_CHANGED, ({ id }) => saveSetting('basemap', id));

  on(EVENTS.THEME_CHANGED, () => {
    // Leaflet caches container colours in a few places; a resize settles them.
    requestAnimationFrame(invalidateSizeIfChanged);
    refresh3DTheme();
  });

  // The GL style follows the base map choice, so changing it in 3D restyles.
  on(EVENTS.BASEMAP_CHANGED, () => refresh3DTheme());

  // The 3D mirror is captured at half resolution while playing; take it again at
  // full resolution once the frame being looked at stops changing.
  on(EVENTS.ANIMATION_STATE, ({ playing }) => {
    if (!playing) remirrorAll({ canvasOnly: true });
  });

  // A restyle drops every layer the GL map held, so re-feed it. The renderer
  // skips slots whose frame is already drawn, so the mirror is fed from the
  // layers the 2D map already holds rather than through a re-render.
  on(EVENTS.MAP3D_READY, () => {
    const failed = remirrorAll();
    refreshLightning({ force: true });
    if (failed.length) console.info('[3d] could not mirror:', failed.join(', '));
  });

  // Leaving 3D by any route must reset the toggle's pressed state.
  on(EVENTS.MODE_CHANGED, ({ mode }) => {
    const btn = byId('btn-3d');
    if (btn) {
      btn.setAttribute('aria-pressed', String(mode === '3d'));
      btn.classList.toggle('btn--active', mode === '3d');
    }
    // Products GL fetched for itself never had a Leaflet layer on the map;
    // rebuild them so 2D is not empty on the way back.
    if (mode === '2d' && exitGlDirect()) renderAll(time.current);
  });

  // Station models are fetched for the window on screen, so a pan to somewhere
  // the cached window does not cover needs a new request.
  map.on('moveend zoomend', debounce(() => synoptic.onViewChanged(), 400));

  // The station canvas is click-through, so the map delivers the click and the
  // nearest plot is looked up rather than hit-tested against painted pixels.
  map.on('click', (event) => {
    const station = synoptic.stationNear(event.containerPoint);
    if (station) openStationCard(station);
  });

  // The same, for the GL view, where Leaflet sees no clicks at all.
  on(EVENTS.MAP3D_READY, ({ gl }) => bindStationClicks3D(gl));

  // Station models follow the scrubber like every other layer.
  on(EVENTS.TIME_COMMITTED, debounce(() => synoptic.onTimeChanged(), 350));

  window.addEventListener('resize', debounce(invalidateSizeIfChanged, 150));

  // Re-render on view change so viewport-dependent products (OPERA, accumulation)
  // stay correct, but only once the map has settled.
  map.on('moveend zoomend', debounce(() => {
    if (!runtime.interacting) renderAll(time.current);
  }, 220));
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */

async function boot() {
  // 1. Theme and performance profile before any rendering decision is made.
  document.documentElement.dataset.theme = runtime.theme;
  applyPerformanceMode();

  // Playback paces itself on the rendered frame; the controller cannot import
  // the renderer without dragging the map stack into a module that must load
  // without a DOM.
  timeCtl.setFramePacer(whenRenderSettled);
  // Products that hold their frame while the timeline moves catch up here.
  timeCtl.setPlaybackSettled(() => {
    flushPending();
    renderAll(time.current);
  });

  // 2. Map first, so the user sees something immediately.
  initMap();
  bindLayerControl(map);
  applyOrder();
  const savedBasemap = loadSetting('basemap', MAP_DEFAULTS.basemap);
  if (savedBasemap !== MAP_DEFAULTS.basemap) setBasemap(savedBasemap);

  // 3. Restore selections, then build the shell around them.
  restoreSession();
  buildRail();
  buildTimeline();
  buildLegend();
  buildSearch();
  bindTopbar();
  bindShortcuts();
  bindEvents();
  initOutlookFocus();
  initLayerManager();
  // Outlooks and drawings join the layer list as orderable overlays.
  registerOverlayLayers();
  syncCards();
  // The docked rail and timeline are measured so the panel sheet can sit above
  // them on a phone instead of underneath.
  trackDockedChrome();

  // 4. Start at the live edge and draw the first weather frame.
  timeCtl.goLive();
  timeCtl.startAutoFollow();

  // 5. With the map drawn, fetch what the session is most likely to want next.
  //    Outlooks are this application's reason for existing, so the storage SDK is
  //    pulled in while the browser is idle — off the critical path, but usually
  //    there before the panel is opened.
  prefetchIdle();

  // 6. Lightning loads in parallel; it must not gate the weather render.
  initLightning().catch((error) => {
    console.error('[boot] lightning init failed:', error);
    toast('Lightning data is unavailable', { tone: 'error' });
  });

  // Open the radar panel on a first visit so the controls are discoverable —
  // but not on a phone, where the panel is a bottom sheet that covers most of
  // the map. There the first thing to show is the map itself; the rail is
  // already visible and says what the panels are.
  if (!loadSetting('layers', null) && !DEVICE.mobile) openGroup('precip');

  emit(EVENTS.STATUS, { ready: true });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}

// Exposed for console debugging and the test harness; nothing in the
// application itself reads these.
window.RadarLoop = {
  slots,
  time,
  runtime,
  renderAll,
  playback: timeCtl,
  map: () => map,
  lightningAll: () => lightningState.all,
  lightningFiltered: () => lightningState.filtered,
  lightningLifespan: () => lightningState.lifespanHours,
  lightning: lightningState,
  refreshLightning,
  strikeCueState,
  gl: () => getGl(),
  mirrorStats: () => ({ ...mirrorStats }),
  mirrorKind,
  phases: () => ({ ...(runtime.phases || {}) }),
  tileWorkers: () => ({ ...poolStats }),
  mapsglLayerIds: () => (window.__mapsglController?.weatherLayerIds || []).slice(),
  /** The stations a click can land on, for the 3D hit-test check. */
  plottedStations: () => synoptic.plottedStations(),
  observations: () => ({
    held: synoptic.stationCount(),
    plotted: synoptic.plottedCount(),
    at: synoptic.lastUpdated(),
    enabled: synoptic.options.enabled,
    scale: synoptic.plotScale(),
    forTime: synoptic.observationTime()?.toISOString() ?? null,
    sampleTemps: synoptic.sampleTemps(),
    magnification: mirrorMagnification(),
  }),
  refreshOverlayMirror,
  /** Opens the card for whichever station is plotted nearest the view centre. */
  openNearestStation: () => {
    const centre = map.getSize().divideBy(2);
    let found = null;
    for (let r = 20; r <= 260 && !found; r += 20) found = synoptic.stationNear(centre, r);
    if (!found) return null;
    openStationCard(found, is3D() ? getGl() : null);
    return found.id;
  },
  showLocation,
  startDrawing: () => draw.toggleDrawing(true),
  isDrawing: () => draw.isDrawing(),
  drawnCount: () => draw.drawnLayerCount(),
  addPolygon: (layer) => draw.addPolygon(layer),
  playSound: () => playStrikeSound(),
  soundUnlocked: () => isUnlocked(),
  soundPool: () => poolState(),
  selectProduct: (g, t) => selectProduct(g, t),
  setLayerEnabled,
  setLayerOpacity,
  moveLayer,
  layerOrder: () => activeInOrder(),
  setBasemap,
  openGroup,
  /** Drives the outlook-focus path directly, for the test harness. */
  focusWindow: (start, end) =>
    focusOutlook(start, end, { source: 'outlook:manual', label: 'Test window', userInitiated: true }),
};


// Debug/diagnostic surface for the catalog.
window.__layers = { LAYER_CATALOG, LAYER_ORDER };
// Tile addressing has to agree between the two views, so the rule is reachable
// from the harness that compares them.
window.__mirror3d = { tileScheme, usesFlippedY };
// The live strike feed's decoder and counters, for its own checks: the
// projection was settled by where the strikes land, so the test needs to look
// at decoded positions rather than at pixels alone.
// The projection the bulk renderer inlines, so a check can hold it against
// Leaflet's own — every strike lands in the wrong place if these disagree.
window.__strikeRender = { mercatorX, mercatorY, colourForAge, ageStops };
// Group-to-pane mapping, so the stacking checks can ask rather than guess.
window.__paneFor = paneFor;
// The projections as last drawn, so the hail checks can read what the map shows.
window.__nowcastClusters = () => lastNowcastClusters();
// The strike canvas, so the mark checks can ask what it last drew and how.
window.__strikeLayer = () => getStrikeLayer();
// The rainfall ladder and its conversions, for checking what part of the scale
// real reflectivity actually reaches.
window.__palettes = { MMH_INTERVALS };
window.__radarScale = { dbzToMmh, encodedToDbz, encodedToMmh };
// The local frame store, so its checks can read what was kept.
window.__strikeStore = { summary: strikeStoreSummary, prune: strikeStorePrune };
// The nowcast's radar machinery, so its checks can drive the correlation
// directly rather than waiting for a storm to turn up.
window.__nowcast = {
  bestShift, measureMotion, calculateNowcast, radarHints, resetRadarHints,
  remainingLife: remainingLifeMinutes, resetNowcastHistory, nowcastInternals,
  impactLevel, hailRisk, seedRadarHint,
};
window.__windyLightning = {
  decodeFeed, decodeStrike, parseFrame, bufferStrikes, framesCovering, feedStats,
};
// The catalog as the pickers see it — after the merge, the scrub and the
// ordering pass — so the list checks read the same thing the interface does.
window.__catalog = { LAYER_CATALOG, LAYER_ORDER };
// The satellite decode, reachable for its own checks: the two candidate
// polarities are exact negatives, so the test needs the rule and the pixels
// rather than a screenshot.
window.__windySat = {
  deinvertBlocks, daylightGrid, composeChannels,
  toLiveUrl, toArchiveUrl, frameTimeFromUrl, isArchiveOnly, archiveFrameTime,
};


});

  __mod('main.js');
})();
