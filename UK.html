<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadarLoop</title>

  <!-- The redirect itself. The meta refresh runs with scripting disabled and is
       the one that always fires; the script below is only there to make the
       back button behave. -->
  <meta http-equiv="refresh" content="0; url=https://handry-outlook.github.io/RadarLoop/radarloop/">
  <link rel="canonical" href="https://handry-outlook.github.io/RadarLoop/radarloop/">
  <meta name="robots" content="noindex">

  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0d1219;
      color: #cbd5e1;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f8fafc; color: #334155; }
    }
    .panel { text-align: center; padding: 1.5rem; }
    a { color: #38bdf8; }
    @media (prefers-color-scheme: light) { a { color: #0284c7; } }
  </style>
</head>
<body>
  <!-- Only ever seen if both the meta refresh and the script fail to fire. -->
  <div class="panel">
    <p>Taking you to RadarLoop…</p>
    <p><a href="https://handry-outlook.github.io/RadarLoop/radarloop/">Continue to RadarLoop</a></p>
  </div>

  <script>
    // `replace` rather than assigning to href: this page should not become a
    // history entry, or pressing back from RadarLoop would land here and
    // immediately bounce forward again.
    location.replace('https://handry-outlook.github.io/RadarLoop/radarloop/');
  </script>
</body>
</html>
